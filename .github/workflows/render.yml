name: Render Remotion MP4

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Render MP4
        run: |
          mkdir -p out
          npx remotion render src/index.ts GPT55Launch out/video.mp4 --codec=h264

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: out/video.mp4
