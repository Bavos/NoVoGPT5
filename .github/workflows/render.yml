name: Render Remotion MP4

on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build MP4
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpt55-video
          path: out/gpt55-video.mp4
